<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Health theme preview</title><desc id="desc">A blue and seafoam medical clinic layout with layered care imagery and structured patient information.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8f7"/><stop offset="1" stop-color="#dceef5"/></linearGradient><linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4b91a8"/><stop offset="1" stop-color="#173d58"/></linearGradient></defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="44" fill="#174f70"/><rect y="44" width="1200" height="82" fill="#fff"/><text x="74" y="92" font-family="Georgia" font-size="28" fill="#173d58">NORTHSTAR HEALTH</text><g fill="#426273" font-family="Arial" font-size="13"><text x="550" y="92">CARE AREAS</text><text x="680" y="92">PROVIDERS</text><text x="800" y="92">PATIENT INFO</text></g><rect x="988" y="68" width="150" height="42" rx="21" fill="#ef8a66"/><text x="1016" y="94" font-family="Arial" font-size="12" fill="#fff">REQUEST A VISIT</text>
  <text x="78" y="206" font-family="Arial" font-size="13" letter-spacing="3" fill="#2f7f82">HEALTHCARE / HUMAN CLARITY</text><text x="76" y="287" font-family="Georgia" font-size="64" fill="#173d58">Modern healthcare</text><text x="76" y="357" font-family="Georgia" font-size="64" fill="#173d58">with human clarity.</text><text x="80" y="413" font-family="Arial" font-size="18" fill="#526b76">Care built around understandable conversations</text><text x="80" y="440" font-family="Arial" font-size="18" fill="#526b76">and practical next steps.</text><rect x="80" y="486" width="180" height="50" rx="25" fill="#174f70"/><rect x="274" y="486" width="170" height="50" rx="25" fill="none" stroke="#2f7f82"/>
  <rect x="680" y="178" width="405" height="430" rx="110" fill="url(#photo)"/><circle cx="882" cy="330" r="92" fill="#d6ede8" opacity=".7"/><rect x="602" y="420" width="230" height="218" rx="54" fill="#fff" stroke="#b8d8d6"/><rect x="760" y="565" width="330" height="102" rx="28" fill="#173d58"/><text x="792" y="609" font-family="Arial" font-size="12" letter-spacing="2" fill="#7bd2c6">CARE PATH</text><text x="792" y="640" font-family="Georgia" font-size="23" fill="#fff">Listen. Explain. Coordinate.</text>
  <g transform="translate(76 684)"><rect width="310" height="56" rx="20" fill="#fff"/><rect x="328" width="310" height="56" rx="20" fill="#fff"/><rect x="656" width="310" height="56" rx="20" fill="#fff"/></g>
</svg>
