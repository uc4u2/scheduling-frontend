<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Quiet Harbor community website preview</title>
  <desc id="description">A warm cream and deep green editorial website with a cinematic hero, program rail, community support selector, and rounded imagery.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f3a"/>
      <stop offset=".62" stop-color="#1e6860"/>
      <stop offset="1" stop-color="#c8794d"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082c29" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#123f3a" stop-opacity=".54"/>
      <stop offset="1" stop-color="#123f3a" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a07b"/>
      <stop offset="1" stop-color="#795949"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173d38" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="18" fill="#f4f0e5"/>
  <rect x="0" y="0" width="1200" height="78" fill="#f7f3e9"/>
  <line x1="0" y1="77.5" x2="1200" y2="77.5" stroke="#c8d5cf"/>
  <text x="62" y="43" fill="#173b37" font-family="Georgia, serif" font-size="25" letter-spacing="1">Quiet Harbor</text>
  <text x="592" y="42" fill="#264d47" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">ABOUT US</text>
  <text x="682" y="42" fill="#264d47" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">PROGRAMS</text>
  <text x="777" y="42" fill="#264d47" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">GET INVOLVED</text>
  <text x="897" y="42" fill="#264d47" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">EVENTS</text>
  <text x="967" y="42" fill="#264d47" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">CONTACT</text>
  <rect x="1050" y="20" width="112" height="39" rx="19.5" fill="#1f6d65"/>
  <text x="1106" y="44" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">GET SUPPORT</text>

  <rect x="0" y="78" width="1200" height="430" fill="url(#hero)"/>
  <circle cx="997" cy="210" r="168" fill="#f3d5bd" opacity=".17" filter="url(#soft)"/>
  <circle cx="875" cy="260" r="96" fill="#f7ead8" opacity=".17"/>
  <path d="M780 508V322c0-60 49-109 109-109h118c67 0 121 54 121 121v174z" fill="#efd0b6" opacity=".22"/>
  <circle cx="887" cy="248" r="48" fill="url(#portrait)"/>
  <path d="M822 430c7-87 31-139 67-156 42 24 70 77 83 156z" fill="#eee1ce" opacity=".72"/>
  <circle cx="1009" cy="280" r="42" fill="#ad694c"/>
  <path d="M958 430c8-70 26-112 53-127 38 25 59 67 65 127z" fill="#173b37" opacity=".84"/>
  <rect x="0" y="78" width="1200" height="430" fill="url(#shade)"/>

  <rect x="62" y="132" width="212" height="28" rx="14" fill="#0b312d" fill-opacity=".34" stroke="#fff" stroke-opacity=".45"/>
  <text x="168" y="150" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2">COMMUNITY • CARE • CONNECTION</text>
  <text x="62" y="226" fill="#fffaf0" font-family="Georgia, serif" font-size="63" letter-spacing="-2.2">
    <tspan x="62" dy="0">Care that helps</tspan>
    <tspan x="62" dy="61">people feel supported</tspan>
    <tspan x="62" dy="61">and connected.</tspan>
  </text>
  <text x="64" y="432" fill="#fff" fill-opacity=".82" font-family="Arial, sans-serif" font-size="16">
    <tspan x="64" dy="0">Welcoming programs, practical guidance, and meaningful</tspan>
    <tspan x="64" dy="25">connection for people across every stage of community life.</tspan>
  </text>
  <rect x="62" y="467" width="144" height="44" rx="22" fill="#c8794d"/>
  <text x="134" y="494" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">EXPLORE PROGRAMS</text>
  <rect x="218" y="467" width="116" height="44" rx="22" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".55"/>
  <text x="276" y="494" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">GET INVOLVED</text>

  <rect x="0" y="508" width="1200" height="106" fill="#e5eeea"/>
  <text x="62" y="539" fill="#b66c45" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="2">PROGRAM PATHWAYS</text>
  <g filter="url(#shadow)">
    <rect x="62" y="552" width="248" height="45" rx="14" fill="#f7f3e9" stroke="#c9d5cf"/>
    <rect x="320" y="552" width="248" height="45" rx="14" fill="#f7f3e9" stroke="#c9d5cf"/>
    <rect x="578" y="552" width="248" height="45" rx="14" fill="#f7f3e9" stroke="#c9d5cf"/>
    <rect x="836" y="552" width="302" height="45" rx="14" fill="#f7f3e9" stroke="#c9d5cf"/>
  </g>
  <text x="82" y="580" fill="#c8794d" font-family="Georgia, serif" font-size="17">01</text><text x="120" y="580" fill="#173b37" font-family="Georgia, serif" font-size="16">Health and wellbeing</text>
  <text x="340" y="580" fill="#c8794d" font-family="Georgia, serif" font-size="17">02</text><text x="378" y="580" fill="#173b37" font-family="Georgia, serif" font-size="16">Social connection</text>
  <text x="598" y="580" fill="#c8794d" font-family="Georgia, serif" font-size="17">03</text><text x="636" y="580" fill="#173b37" font-family="Georgia, serif" font-size="16">Community outreach</text>
  <text x="856" y="580" fill="#c8794d" font-family="Georgia, serif" font-size="17">04</text><text x="894" y="580" fill="#173b37" font-family="Georgia, serif" font-size="16">Information and navigation</text>

  <rect x="0" y="614" width="1200" height="146" fill="#f4f0e5"/>
  <text x="62" y="652" fill="#b66c45" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="2">A WELCOMING COMMUNITY</text>
  <text x="62" y="704" fill="#173b37" font-family="Georgia, serif" font-size="43">Who we support</text>
  <text x="62" y="730" fill="#4c6863" font-family="Arial, sans-serif" font-size="13">An accessible selector pairs every support path with meaningful imagery.</text>
  <rect x="660" y="640" width="478" height="96" rx="24" fill="#1f6d65"/>
  <rect x="660" y="640" width="150" height="96" rx="24" fill="#fff" fill-opacity=".1"/>
  <rect x="660" y="656" width="3" height="64" rx="1.5" fill="#d07b4b"/>
  <text x="680" y="675" fill="#d99065" font-family="Georgia, serif" font-size="18">01</text>
  <text x="680" y="705" fill="#fff" font-family="Georgia, serif" font-size="19">Older adults</text>
  <path d="M827 736v-50c0-23 19-42 42-42h208c34 0 61 27 61 61v31z" fill="#d5a078" opacity=".72"/>
</svg>
