<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Touchline Club theme preview</title>
  <desc id="description">A daylight community sports website with an evergreen and gold split hero, diagonal action photography, bold typography, and pathway cards.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17844b"/><stop offset="1" stop-color="#063c24"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8dda7"/><stop offset=".46" stop-color="#4e9b5c"/><stop offset="1" stop-color="#0b4e2d"/></linearGradient>
    <clipPath id="cut"><path d="M770 120H1600V650H690Z"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="#f7f5ec"/>
