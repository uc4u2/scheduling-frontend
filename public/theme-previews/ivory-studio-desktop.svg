  <g clip-path="url(#hero)">
    <image href="/theme-previews/ivory-studio-hero.webp" x="0" y="116" width="1600" height="650" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="116" width="1600" height="650" fill="url(#shade)"/>
  </g>
  <text x="95" y="300" fill="#f7dfb6" font-family="Arial,sans-serif" font-size="13" letter-spacing="6">PRIVATE BEAUTY STUDIO</text>
  <text x="90" y="395" fill="#fffaf4" font-family="Georgia,serif" font-size="78">Beauty, made</text>
  <text x="90" y="475" fill="#fffaf4" font-family="Georgia,serif" font-size="78">personal.</text>
  <text x="95" y="535" fill="#fffaf4" font-family="Arial,sans-serif" font-size="18">Thoughtful appointments shaped around every client's goals and style.</text>
  <rect x="95" y="590" width="255" height="60" fill="#cfa15a"/>
