    <rect x="0" y="116" width="1600" height="650" fill="url(#shade)"/>
  </g>
  <text x="95" y="300" fill="#f7dfb6" font-family="Arial,sans-serif" font-size="13" letter-spacing="6">PRIVATE BEAUTY STUDIO</text>
