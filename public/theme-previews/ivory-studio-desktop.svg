  <text x="95" y="835" fill="#98642e" font-family="Arial,sans-serif" font-size="11" letter-spacing="5">THE EXPERIENCE</text>
  <text x="95" y="910" fill="#3e2c22" font-family="Georgia,serif" font-size="50">Personal. Polished. Considered.</text>
  <line x1="920" y1="835" x2="920" y2="950" stroke="#d6c1a7"/>
  <line x1="1190" y1="835" x2="1190" y2="950" stroke="#d6c1a7"/>
