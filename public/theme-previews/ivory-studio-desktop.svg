<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ivory Studio desktop theme preview</title>
  <desc id="desc">A bright ivory and champagne salon website with editorial photography, scrolling service rails, and a refined consultation panel.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#2b1b13" stop-opacity=".78"/>
      <stop offset=".56" stop-color="#2b1b13" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2b1b13" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="hero"><rect x="0" y="116" width="1600" height="650"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="#f8f3ec"/>
  <rect width="1600" height="116" fill="#fffaf4"/>
  <circle cx="75" cy="58" r="32" fill="#3e2c22"/>
