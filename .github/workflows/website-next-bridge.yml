name: Frontend Release Readiness

on:
  push:
    branches:
      - main
      - feature/nextjs-theme-release-v1
      - feature/nextjs-theme-bridge-v1
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-next-bridge-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run focused website bridge tests
        run: >
          CI=1 npm test -- --runInBand --watch=false
          src/pages/sections/management/OperationsLauncher.test.jsx
          src/pages/sections/management/operationsLauncherInstall.test.js
          src/pages/sections/management/websiteCatalogUi.test.js
          src/pages/sections/management/websiteStyleBridge.test.js

      - name: Run classic renderer regression tests
        run: >
          CI=1 npm test -- --runInBand --watch=false
          src/components/website/__tests__/websiteDesign.test.jsx

      - name: Production build
        env:
          GENERATE_SOURCEMAP: "false"
          SKIP_REACT_SNAP: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
          REACT_APP_API_URL: "http://127.0.0.1:5001"
          REACT_APP_TENANT_WEB_NEXT_URL: "http://127.0.0.1:3402"
        run: npm run build
